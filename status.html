<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>源状态 · 做爱源</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e1b4b); color:#e2e8f0;
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; padding:20px 0; }
  header h1 { font-size:24px; }
  header p { color:#94a3b8; font-size:13px; margin-top:6px; }
  .cards { display:flex; gap:10px; margin:16px 0 24px; }
  .card {
    flex:1; text-align:center; padding:18px 8px; border-radius:18px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  }
  .card .num { font-size:28px; font-weight:800; background:linear-gradient(90deg,#60a5fa,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card .label { font-size:11px; color:#94a3b8; margin-top:6px; }
  .sec { margin-bottom:24px; }
  .sec h2 { font-size:14px; color:#94a3b8; margin-bottom:10px; font-weight:600; letter-spacing:1px; }
  .hist {
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    border-radius:18px; padding:6px 16px;
  }
  .hist-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .hist-item:last-child { border-bottom:none; }
  .hist-time { font-size:13px; color:#cbd5e1; }
  .hist-time small { color:#64748b; font-size:11px; margin-left:8px; }
  .hist-count {
    font-size:13px; color:#a5b4fc; background:rgba(99,102,241,0.15);
    padding:3px 10px; border-radius:20px;
  }
  .back { display:inline-block; color:#94a3b8; font-size:14px; text-decoration:none; margin-top:4px; }
  .loading { text-align:center; color:#64748b; padding:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>源状态</h1>
    <p>gan-jibamao.github.io</p>
  </header>

  <div class="cards">
    <div class="card"><div class="num" id="count">—</div><div class="label">当前包数</div></div>
    <div class="card"><div class="num" id="changes">—</div><div class="label">initnil 变化次数</div></div>
    <div class="card"><div class="num" id="lastsync" style="font-size:16px;">—</div><div class="label">最后同步</div></div>
  </div>

  <div class="sec">
    <h2>initnil 更新历史</h2>
    <div class="hist" id="hist"><div class="loading">加载中…</div></div>
  </div>

  <a class="back" href="./">← 返回首页</a>
</div>

<script>
  function rel(t) {
    var d = new Date(t), n = Date.now();
    var s = Math.floor((n - d.getTime()) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s/60) + ' 分钟前';
    if (s < 86400) return Math.floor(s/3600) + ' 小时前';
    return Math.floor(s/86400) + ' 天前';
  }
  fetch('status.json').then(r => r.json()).then(function(st) {
    document.getElementById('count').textContent = st.package_count ?? '—';
    document.getElementById('changes').textContent = (st.history || []).length;
    document.getElementById('lastsync').textContent = st.last_sync ? rel(st.last_sync) : '—';
    var h = document.getElementById('hist');
    if (!st.history || !st.history.length) { h.innerHTML = '<div class="loading">暂无历史记录</div>'; return; }
    var html = '';
    st.history.slice().reverse().forEach(function(e) {
      html += '<div class="hist-item"><span class="hist-time">' + e.time.replace('T',' ').replace('Z','') +
              '<small>' + rel(e.time) + '</small></span>' +
              '<span class="hist-count">' + e.packages + ' 个包</span></div>';
    });
    h.innerHTML = html;
  }).catch(function() {
    document.getElementById('hist').innerHTML = '<div class="loading">加载失败</div>';
  });
</script>
</body>
</html>
