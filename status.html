<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f9">
<title>源状态 · 做爱源</title>
<link rel="stylesheet" href="theme.css?v=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; padding:20px 0; }
  header h1 { font-size:24px; font-weight:800; letter-spacing:.01em; }
  header p { color:var(--dim-2); font-size:13px; margin-top:6px; }
  .cards { display:flex; gap:10px; margin:16px 0 24px; }
  .card {
    flex:1; text-align:center; padding:18px 8px; border-radius:18px;
    background:var(--panel); border:1px solid var(--line);
    box-shadow:var(--stat-shadow);
    display:flex; flex-direction:column; justify-content:center;
  }
  .card .num {
    font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;
    min-height:32px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(90deg,var(--stat-blue),var(--stat-violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card .num.sm { font-size:15px; }
  .card .label { font-size:11px; color:var(--dim-2); margin-top:6px; letter-spacing:.04em; }
  .sec h2 {
    font-size:12px; color:var(--dim-2); margin-bottom:10px;
    font-weight:600; letter-spacing:.16em;
  }
  .hist {
    background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:4px 16px; box-shadow:var(--stat-shadow);
  }
  .hist-item { padding:14px 0; border-bottom:1px solid var(--line); }
  .hist-item:last-child { border-bottom:none; }
  .hist-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .hist-time { font-size:13px; color:var(--txt); font-variant-numeric:tabular-nums; }
  .hist-time small { color:var(--dim-2); font-size:11px; margin-left:8px; }
  .hist-count {
    font-size:12px; color:var(--ver-fg); background:var(--ver-bg);
    border:1px solid var(--ver-bd); padding:3px 10px; border-radius:20px; white-space:nowrap;
  }
  .chg { font-size:13px; margin-top:8px; line-height:1.6; }
  .chg.add { color:var(--rl-fg); }
  .chg.upd { color:var(--arm-fg); }
  .chg.del { color:var(--del-fg); }
  .chg.note { color:var(--dim-2); }
  .back {
    display:inline-block; color:var(--dim); font-size:14px;
    text-decoration:none; margin-top:18px;
  }
  .loading { text-align:center; color:var(--dim-2); padding:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>源状态</h1>
    <p>gan-jibamao.github.io</p>
  </header>

  <div class="cards">
    <div class="card"><div class="num" id="count">—</div><div class="label">当前包数</div></div>
    <div class="card"><div class="num" id="changes">—</div><div class="label">initnil 变化次数</div></div>
    <div class="card"><div class="num sm" id="lastsync">—</div><div class="label">最后同步</div></div>
  </div>

  <div class="sec">
    <h2>initnil 变更日志</h2>
    <div class="hist" id="hist"><div class="loading">加载中…</div></div>
  </div>

  <a class="back" href="./">← 返回首页</a>
</div>

<script>
  function rel(t) {
    var d = new Date(t), s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s/60) + ' 分钟前';
    if (s < 86400) return Math.floor(s/3600) + ' 小时前';
    return Math.floor(s/86400) + ' 天前';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function(c) {
      return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];
    });
  }
  fetch('status.json').then(function(r){return r.json();}).then(function(st) {
    document.getElementById('count').textContent = st.package_count != null ? st.package_count : '—';
    document.getElementById('changes').textContent = (st.history || []).length;
    document.getElementById('lastsync').textContent = st.last_sync ? rel(st.last_sync) : '—';
    var h = document.getElementById('hist');
    if (!st.history || !st.history.length) { h.innerHTML = '<div class="loading">暂无记录</div>'; return; }
    var html = '';
    st.history.slice().reverse().forEach(function(e) {
      var ch = e.changes || {};
      var item = '<div class="hist-item"><div class="hist-head">' +
        '<span class="hist-time">' + esc(e.time.replace('T',' ').replace('Z','')) +
        '<small>' + rel(e.time) + '</small></span>' +
        '<span class="hist-count">' + e.packages + ' 个包</span></div>';
      if (e.initial) {
        item += '<div class="chg note">📸 建立初始快照</div>';
      } else {
        var n = 0;
        (ch.added || []).forEach(function(x){ item += '<div class="chg add">➕ ' + esc(x.name) + ' ' + esc(x.version) + '</div>'; n++; });
        (ch.updated || []).forEach(function(x){ item += '<div class="chg upd">⬆️ ' + esc(x.name) + ' ' + esc(x.from) + ' → ' + esc(x.to) + '</div>'; n++; });
        (ch.removed || []).forEach(function(x){ item += '<div class="chg del">➖ ' + esc(x.name) + ' ' + esc(x.version) + '</div>'; n++; });
        if (!n) item += '<div class="chg note">无内容变化（仅重新同步）</div>';
      }
      item += '</div>';
      html += item;
    });
    h.innerHTML = html;
  }).catch(function() {
    document.getElementById('hist').innerHTML = '<div class="loading">加载失败</div>';
  });
</script>
</body>
</html>
