<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>做爱 · Sileo 源</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e1b4b;
    --bg3: #0f172a;
    --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.12);
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: bgmove 18s ease infinite;
    padding: 24px;
    color: var(--text);
  }
  @keyframes bgmove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .wrap { width: 100%; max-width: 400px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 40px 28px 30px;
    text-align: center;
    backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  }
  .icon {
    width: 92px; height: 92px;
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 12px 30px rgba(0,0,0,0.4);
  }
  h1 { font-size: 27px; margin: 18px 0 6px; font-weight: 700; letter-spacing: 0.5px; }
  .url {
    font-size: 13px; color: var(--muted);
    word-break: break-all; margin-bottom: 26px;
  }
  .btn {
    display: block; width: 100%;
    padding: 16px 0; border-radius: 16px;
    font-size: 17px; font-weight: 600;
    text-decoration: none; margin-bottom: 12px;
    transition: transform .08s ease, opacity .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer; border: none; color: #fff;
  }
  .btn:active { transform: scale(0.97); }
  .btn.sileo {
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    box-shadow: 0 10px 30px rgba(99,102,241,0.4);
  }
  .btn.sileo:hover { box-shadow: 0 14px 40px rgba(99,102,241,0.55); }
  .btn.cydia { background: #334155; color: #e2e8f0; }
  .btn.browse {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    color: #a5b4fc;
  }
  .btn.copy {
    background: transparent;
    border: 1px solid var(--border);
    color: #cbd5e1;
  }
  .badge-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 5px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #cbd5e1;
  }
  .hint { font-size: 12px; color: #64748b; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="icon" src="CydiaIcon.png" alt="源图标">
      <h1>做爱</h1>
      <p class="url">https://gan-jibamao.github.io/</p>

      <div class="badge-row">
        <span class="badge" id="pkgcount">— 插件</span>
        <span class="badge">已签名</span>
        <span class="badge">自动同步</span>
        <img src="https://visitor-badge.laobi.icu/badge?page_id=gan-jibamao.repo" alt="访问量" style="height:23px;border-radius:12px;">
      </div>

      <a class="btn sileo" href="sileo://source/https://gan-jibamao.github.io/">添加到 Sileo</a>
      <a class="btn cydia" href="cydia://url/https://cydia.saurik.com/api/share#?source=https%3A%2F%2Fgan-jibamao.github.io%2F%2F">添加到 Cydia</a>
      <a class="btn browse" href="packages.html">浏览全部插件</a>
      <a class="btn browse" href="status.html">查看源状态</a>
      <button class="btn copy" onclick="copyURL()">复制源地址</button>

      <p class="hint">点击「添加到 Sileo」会直接唤起 Sileo 并添加本源。<br>若按钮无效，请复制源地址后手动在 Sileo 中粘贴添加。</p>
    </div>
  </div>

  <script>
    fetch('status.json').then(function(r){return r.json();}).then(function(d){
      if (d.package_count) document.getElementById('pkgcount').textContent = d.package_count + ' 插件';
    }).catch(function(){});
    function copyURL() {
      var url = 'https://gan-jibamao.github.io/';
      var btn = document.querySelector('.copy');
      function done() {
        btn.textContent = '已复制 ✓';
        setTimeout(function(){ btn.textContent = '复制源地址'; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, done);
      } else {
        var t = document.createElement('textarea');
        t.value = url;
        document.body.appendChild(t);
        t.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(t);
        done();
      }
    }
  </script>
</body>
</html>
