name: Reassemble aweme.x

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev bzip2 gzip gnupg

      - name: Reassemble aweme.x deb from chunks
        run: |
          cat chunks/aweme.x.* | base64 -d > debs/aweme.x_2.6.2_iphoneos-arm64.deb
          ls -l debs/aweme.x_2.6.2_iphoneos-arm64.deb
          rm -rf chunks/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Build index
        run: sh build_repo.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add aweme.x 2.6.2 (抖音图层)"
          git push
