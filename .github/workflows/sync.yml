name: Sync JailRepo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev bzip2 gzip gnupg

      - name: Sync packages from jailrepo.initnil.com
        run: python3 sync_initnil.py

      - name: Fetch native depictions
        run: python3 fetch_depictions.py

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG key imported"
          else
            echo "no GPG key, will skip signing"
          fi

      - name: Build index + Release
        run: sh build_repo.sh

      - name: Generate package list page
        run: python3 gen_packages_html.py

      - name: Generate status
        run: python3 gen_status.py

      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
          fi
