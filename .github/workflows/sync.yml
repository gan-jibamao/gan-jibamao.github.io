name: Sync JailRepo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev bzip2 gzip gnupg

      - name: Sync packages from jailrepo.initnil.com
        run: python3 sync_initnil.py

      - name: Build index + Release
        run: sh build_repo.sh

      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
