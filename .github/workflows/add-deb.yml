name: Add deb

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'deb 直链（GitHub Release / 任意 https）'
        required: true
      filename:
        description: '写入 debs/ 的文件名'
        required: true
      sha256:
        description: '期望 sha256（留空则不校验）'
        required: false
      message:
        description: '提交说明'
        required: false
        default: 'add deb'

permissions:
  contents: write

concurrency:
  group: add-deb
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev bzip2 gzip gnupg curl

      - name: Download deb
        run: |
          set -e
          curl -fL --retry 5 --retry-all-errors -o "debs/${{ inputs.filename }}" "${{ inputs.url }}"
          ls -l "debs/${{ inputs.filename }}"
          if [ -n "${{ inputs.sha256 }}" ]; then
            echo "${{ inputs.sha256 }}  debs/${{ inputs.filename }}" | sha256sum -c -
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG key imported"
          else
            echo "no GPG key, will skip signing"
          fi

      - name: Build index + Release
        run: sh build_repo.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "${{ inputs.message }}"
          git pull --rebase origin main
          git push
